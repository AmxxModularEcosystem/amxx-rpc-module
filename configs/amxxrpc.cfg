# AmxxRpc configuration (design/16 §2).
# Flat key = value; comments start with '#' or ';'.
# Path: addons/amxmodx/configs/amxxrpc.cfg

# bind address (loopback by default; non-loopback warns: cleartext token, R-4)
host = 127.0.0.1

# TCP port
port = 27016

# shared secret; MUST be at least 16 characters. Empty/short => transport does not start.
token = change-me-please-16chars

# connection limit (must be <= FD_SETSIZE-1)
max_connections = 4

# idle timeout in seconds
idle_timeout = 120

# timeout before rpc.auth in seconds (must be shorter than idle_timeout)
pre_auth_timeout = 5

# maximum message size in bytes
max_message_bytes = 1048576

# per-session output buffer cap in bytes; 0 => max_message_bytes * outbox_depth
max_session_out_bytes = 0

# unanswered request timeout in seconds
request_timeout = 15

# I/O -> main queue depth
inbox_depth = 256

# main -> I/O queue depth (per session)
outbox_depth = 256

# requests drained per frame
drain_budget = 64

# fake player limit (Stage 3)
fake_max = 8

# YAPB path (Stage 4); empty => auto-detect
yapb_path =

# log level: error / warn / info / debug
log_level = info
